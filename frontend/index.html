<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mutual Fund Application</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Mutual Fund Investment</h1>

      <div id="flow-container">
        <div class="flow-step" id="step-0">
          <h2>Select Customer</h2>
          <select id="customer-selection"></select>
          <button id="customer-continue-btn">Continue</button>
        </div>

        <div class="flow-step" id="step-1" style="display: none">
          <h2>Select MF House (AMC)</h2>
          <select id="amc-selection"></select>
          <button id="amc-continue-btn">Continue</button>
        </div>

        <div class="flow-step" id="step-2" style="display: none">
          <h2>Select Scheme</h2>
          <input
            type="text"
            id="scheme-search"
            placeholder="Search schemes within the MF house"
          />
          <div id="scheme-list"></div>
        </div>

        <div class="flow-step" id="step-3" style="display: none">
          <h2 id="scheme-name"></h2>
          <p>Latest NAV: <span id="scheme-nav"></span></p>
          <div class="investment-type">
            <button id="lumpsum-btn">Lumpsum</button>
            <button id="sip-btn">SIP</button>
          </div>
        </div>

        <div class="flow-step" id="step-4-lumpsum" style="display: none">
          <h2>Lumpsum Investment</h2>
          <input type="number" id="lumpsum-amount" placeholder="Enter Amount" />
          <button id="lumpsum-invest-btn">Invest</button>
        </div>

        <div class="flow-step" id="step-4-sip" style="display: none">
          <h2>SIP Investment</h2>
          <input
            type="number"
            id="sip-amount"
            placeholder="Enter Monthly Amount"
          />
          <input
            type="number"
            id="sip-installments"
            placeholder="Enter Number of Installments"
          />
          <button id="sip-invest-btn">Invest</button>
        </div>

        <div class="flow-step" id="step-5" style="display: none">
          <h2>Select Account (CBS)</h2>
          <select id="account-selection"></select>
          <button id="confirm-payment-btn">Confirm Payment</button>
        </div>

        <div class="flow-step" id="step-6" style="display: none">
          <h2>Investment Successful!</h2>
          <p>Your investment has been processed.</p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
